<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 營養管理 - 歷史回顧</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <h1>AI 營養管理</h1>
        <nav>
            <a href="index.html">今日紀錄</a>
            <a href="history.html" class="active">歷史回顧</a>
        </nav>
    </header>

    <main class="container">
        
        <section class="summary-section">
            <h2 style="text-align: center; color: var(--primary-color);">📅 歷史回顧</h2>
            <p style="text-align: center; color: var(--text-muted); margin-top: 10px;">檢視過去的飲食與熱量達標狀況</p>
        </section>

        <section class="table-section" id="history-section">
            <div id="history-empty-state" style="text-align: center; padding: 40px 20px; color: var(--text-muted);">
                <p>目前還沒有任何歷史紀錄喔！</p>
                <p style="margin-top: 10px; font-size: 14px;">在「今日紀錄」匯入餐點後，紀錄就會出現在這裡。</p>
            </div>

            <div id="history-container">
                <!-- 歷史紀錄卡片會動態產生在這裡 -->
            </div>
        </section>

    </main>

    <script src="js/storage.js"></script>
    <script src="js/history.js"></script>

</body>
</html>
