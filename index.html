<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 營養管理</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <h1>AI 營養管理</h1>
        <nav>
            <a href="index.html" class="active">單日紀錄</a>
            <a href="history.html">歷史回顧</a>
        </nav>
    </header>

    <main class="container">
        
        <div class="date-selector">
            <label for="record-date">選擇日期：</label>
            <input type="date" id="record-date">
        </div>

        <section class="dashboard-section">
            <div class="dash-header">
                <h2>每日預算</h2>
                <button id="edit-goal-btn" class="edit-btn">
                    <!-- 🌟 方格與筆的經典編輯圖示 -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                    編輯
                </button>
            </div>
            
            <div class="dash-grid">
                <div class="dash-card cal-card">
                    <div class="ring-container main-ring">
                        <svg viewBox="0 0 150 150">
                            <circle class="ring-bg" cx="75" cy="75" r="65"></circle>
                            <circle class="ring-progress" id="cal-ring" cx="75" cy="75" r="65"></circle>
                        </svg>
                        <div class="ring-text">
                            <span class="label">剩餘</span>
                            <span class="value" id="dash-rem-cal">0</span>
                            <span class="unit">kcal</span>
                        </div>
                    </div>
                    <div class="goal-text" id="dash-goal-cal">目標 0 千卡</div>
                </div>

                <div class="dash-card macros-card">
                    <div class="macro-row">
                        <div class="macro-info">
                            <div class="macro-val"><span id="dash-carbs-val">0</span> <span class="macro-goal">/ <span id="dash-carbs-goal">0</span>g</span></div>
                            <div class="macro-name">碳水</div>
                        </div>
                        <div class="mini-ring-container">
                            <svg viewBox="0 0 40 40">
                                <circle class="ring-bg" cx="20" cy="20" r="16"></circle>
                                <circle class="ring-progress carbs-color" id="carbs-ring" cx="20" cy="20" r="16"></circle>
                            </svg>
                        </div>
                    </div>
                    <div class="macro-row">
                        <div class="macro-info">
                            <div class="macro-val"><span id="dash-pro-val">0</span> <span class="macro-goal">/ <span id="dash-pro-goal">0</span>g</span></div>
                            <div class="macro-name">蛋白質</div>
                        </div>
                        <div class="mini-ring-container">
                            <svg viewBox="0 0 40 40">
                                <circle class="ring-bg" cx="20" cy="20" r="16"></circle>
                                <circle class="ring-progress pro-color" id="pro-ring" cx="20" cy="20" r="16"></circle>
                            </svg>
                        </div>
                    </div>
                    <div class="macro-row">
                        <div class="macro-info">
                            <div class="macro-val"><span id="dash-fat-val">0</span> <span class="macro-goal">/ <span id="dash-fat-goal">0</span>g</span></div>
                            <div class="macro-name">脂肪</div>
                        </div>
                        <div class="mini-ring-container">
                            <svg viewBox="0 0 40 40">
                                <circle class="ring-bg" cx="20" cy="20" r="16"></circle>
                                <circle class="ring-progress fat-color" id="fat-ring" cx="20" cy="20" r="16"></circle>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="upload-section">
            <h3 style="margin-bottom: 12px; font-size: 16px; color: var(--primary-color);">📥 匯入 AI 分析結果</h3>
            <textarea id="json-input" rows="5" placeholder="請將 AI 給你的 { ... } 資料完整貼在這裡..."></textarea>
            <button id="import-btn" class="analyze-btn">儲存並匯入紀錄</button>
        </section>

        <section class="table-section">
            <div class="table-responsive">
                <table id="nutrition-table">
                    <thead>
                        <tr>
                            <th>餐別</th>
                            <th>食物名稱</th>
                            <th>大卡</th>
                            <th>碳水</th>
                            <th>蛋白質</th>
                            <th>脂肪</th>
                            <th>營養建議</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr class="empty-row"><td colspan="8">尚無紀錄，請貼上 AI 分析資料。</td></tr>
                    </tbody>
                    <tfoot id="table-footer"></tfoot>
                </table>
            </div>
        </section>

    </main>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>設定每日目標</h3>
                <span class="close-btn" id="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 15px;">輸入您的身體數值，系統將自動為您計算 BMR 與推薦攝取熱量 (TDEE)。</p>
                
                <div class="form-group">
                    <label>性別：</label>
                    <select id="user-gender">
                        <option value="male">男性</option>
                        <option value="female">女性</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>年齡 (歲)：</label>
                    <input type="number" id="user-age" value="25">
                </div>
                <div class="form-group">
                    <label>身高 (cm)：</label>
                    <input type="number" id="user-height" value="170">
                </div>
                <div class="form-group">
                    <label>體重 (kg)：</label>
                    <input type="number" id="user-weight" value="65">
                </div>
                <div class="form-group">
                    <label>日常活動量：</label>
                    <select id="user-activity">
                        <option value="1.2">久坐 (幾乎不運動)</option>
                        <option value="1.375">輕度活動 (每週運動1-3天)</option>
                        <option value="1.55" selected>中度活動 (每週運動3-5天)</option>
                        <option value="1.725">高度活動 (每週運動6-7天)</option>
                        <option value="1.9">非常高度活動 (勞力工作或雙倍訓練)</option>
                    </select>
                </div>
                
                <div class="calc-results">
                    <p>基礎代謝率 (BMR): <strong id="res-bmr">--</strong> kcal</p>
                    <p>推薦攝取量 (TDEE): <strong id="res-tdee" style="color: var(--accent-color); font-size: 18px;">--</strong> kcal</p>
                    <p style="font-size: 13px; color: var(--text-muted); margin-top: 5px;">(營養素比例：碳水40%、蛋白質30%、脂肪30%)</p>
                </div>
            </div>
            <div class="modal-footer">
                <button id="calc-save-btn" class="analyze-btn" style="width: 100%;">計算並儲存目標</button>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
