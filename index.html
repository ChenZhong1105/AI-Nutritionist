<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 營養管理</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <h1>AI 營養管理</h1>
        <nav>
            <a href="index.html" class="active">今日紀錄</a>
            <a href="history.html">歷史回顧</a>
        </nav>
    </header>

    <main class="container">
        
        <section class="summary-section">
            <h2 id="current-date">今日日期：載入中...</h2>
            <div class="goal-card">
                <h3>每日目標</h3>
                <p class="goal-number">1,848 <span class="unit">kcal</span></p>
            </div>
            
            <div class="status-cards">
                <div class="status-card">
                    <h4>已攝取</h4>
                    <p id="total-consumed">0 <span class="unit">kcal</span></p>
                </div>
                <div class="status-card">
                    <h4>剩餘熱量</h4>
                    <p id="remaining-calories">1,848 <span class="unit">kcal</span></p>
                </div>
            </div>
        </section>

        <!-- 修改後的：匯入 JSON 檔案區塊 -->
        <section class="upload-section">
            <div class="upload-box">
                <label for="json-upload" class="upload-label">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" class="icon" viewBox="0 0 24 24">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                    </svg>
                    <span class="text">點擊匯入 AI 分析檔 (.json)</span>
                </label>
                <input type="file" id="json-upload" accept=".json">
            </div>
        </section>

        <section class="table-section">
            <div class="table-responsive">
                <table id="nutrition-table">
                    <thead>
                        <tr>
                            <th>餐別</th>
                            <th>食物名稱</th>
                            <th>總大卡</th>
                            <th>碳水 (g)</th>
                            <th>蛋白質 (g)</th>
                            <th>脂肪 (g)</th>
                            <th>營養建議</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr class="empty-row">
                            <td colspan="7">尚無紀錄，請上傳 AI 檔案。</td>
                        </tr>
                    </tbody>
                    <tfoot id="table-footer">
                        <!-- 日總結會動態產生在這裡 -->
                    </tfoot>
                </table>
            </div>
        </section>

    </main>

    <!-- 現在只需要載入 storage.js 和 app.js，不需要 api.js 了！ -->
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
